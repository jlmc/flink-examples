networks:
  infra_network:
    name: infra
    driver: bridge

services:
  #########################################
  ## Kafka broker for data streaming
  #########################################
  kafka:
    image: confluentinc/cp-kafka:7.7.2
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true" # <-- This enables automatic topic creation
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_LISTENERS: PLAINTEXT://kafka:19092,CONTROLLER://kafka:19093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LOG4J_LOGGERS: "kafka.controller=INFO,kafka.producer.async.DefaultEventHandler=INFO,state.change.logger=INFO"
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - infra_network

  kafka-init:
    image: confluentinc/cp-kafka:7.7.2 # Use the same Kafka image to ensure tools are available
    container_name: kafka-init
    command: [ "/bin/bash", "/create_topics.sh" ]
    volumes:
      - ./docker/volumes/kafka/init/create-topics.sh:/create_topics.sh # Mount the script into the container
    depends_on:
      kafka:
        condition: service_healthy # Ensures Kafka is fully running and healthy
    networks:
      - infra_network # Must be on the same network to reach kafka:19092
    restart: "no" # The service should exit successfully after running the script

  kafka-ui:
    # https://hub.docker.com/r/provectuslabs/kafka-ui
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    ports:
      # Access the UI at http://localhost:8580
      - "8085:8080"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kafka
      # Use the internal broker name (kafka) and internal listener port (19092)
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    healthcheck:
      # Queries the internal health endpoint to ensure the application is running
      # test: [ "CMD-SHELL", "echo > /dev/tcp/localhost/8080 || exit 1" ]
      test: [ "CMD", "nc", "-z", "localhost", "8080" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - infra_network

  # --------------------
  # 2. REDIS SERVICE
  # --------------------
  redis:
    image: redis:3.2-alpine
    container_name: redis
    profiles:
      - dev
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - infra_network

  # --------------------
  # 3. localstack AWS S3 MOCK SERVICE
  # --------------------
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    hostname: minio
    container_name: minio
    networks:
      - infra_network
    ports:
      - "9002:9000" # aws s3 endpoint
      - "9001:9001" # minio console http://localhost:9001
    environment:
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio_setup:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
    container_name: minio_setup
    networks:
      - infra_network
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -e -c "
      echo 'Waiting for MinIO...';
      sleep 5;

      mc alias set minio http://minio:9000 minio minio123;

      mc mb --ignore-existing minio/patient-adt-processing-bucket;

      echo 'Creating prefixes (folders)...';
      echo '' | mc pipe minio/patient-adt-processing-bucket/flink/checkpoints/.keep;
      echo '' | mc pipe minio/patient-adt-processing-bucket/flink/savepoints/.keep;

      echo 'MinIO setup completed successfully';
      "

  # --------------------
  # 5. postgresql SERVICE
  # --------------------
  postgresql:
    image: postgis/postgis:15-3.3-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pw
      POSTGRES_DB: db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d db" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - infra_network

  #########################################
  ## Mongo cluster with transaction support
  #########################################
  mongo1:
    image: mongo:6.0.13
    container_name: mongo1
    networks:
      - infra_network
    restart: always
    ports:
      - "27017:27017"
    command: mongod --replSet dataDemos --bind_ip localhost,mongo1

  mongo2:
    image: mongo:6.0.13
    container_name: mongo2
    networks:
      - infra_network
    restart: always
    ports:
      - "27018:27017"
    command: mongod --replSet dataDemos --bind_ip localhost,mongo2

  mongodb:
    image: mongo:6.0.13
    container_name: mongodb
    networks:
      - infra_network
    depends_on:
      - mongo1
      - mongo2
    healthcheck:
      test: |
        mongosh --host mongo1 --eval "rs.initiate({
          _id: 'dataDemos',
          members: [
            {_id: 0, host: 'mongo1'},
            {_id: 1, host: 'mongo2'}
          ]
        })"
      interval: 10s
      timeout: 30s
      retries: 3
      start_period: 30s
    volumes:
      - ./docker/volumes/mongo/init:/docker-entrypoint-initdb.d
      #- ./docker/volumes/mongodb/data:/data/db
      #- ./docker/mongodb:/docker-entrypoint-initdb.d
    command: bash -c "sleep 30 && mongosh mongodb://mongo1:27017 -f /docker-entrypoint-initdb.d/mongo-init.js"

  #########################################
  ## Rabbit MQ
  #########################################
  rabbitmq:
    image: rabbitmq:4.2.1-management
    container_name: rabbitmq
    networks:
      - infra_network
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./docker/volumes/rabbitmq/rabbitmq.config:/etc/rabbitmq/rabbitmq.config:ro
      - ./docker/volumes/rabbitmq/rabbitmq-definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s

  #########################################
  ## wiremock server to mock API GW responses
  #########################################
  wiremock:
    # https://wiremock.org/docs/standalone/docker/
    #  curl http://localhost:9069/__admin/mappings | jq .
    image: wiremock/wiremock:3.13.2
    container_name: wiremock
    networks:
      - infra_network
    command:
      - "--port=9069"
      - "--verbose"
      - "--global-response-templating"
    ports:
      - "9069:9069"
    volumes:
      - ./docker/volumes/wiremock/mappings:/./home/wiremock/mappings
      - ./docker/volumes/wiremock/__files:/./home/wiremock/__files
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:9069/__admin/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
