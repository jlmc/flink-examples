services:
  jobmanager:
    # image: apache/flink:1.20.3-scala_2.12-java11
    image: flink:1.20.3-java17
    container_name: jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
    networks:
      - flink_network

  taskmanager:
    # image: apache/flink:1.20.3-scala_2.12-java11
    image: flink:1.20.3-java17
    container_name: taskmanager
    depends_on:
      - jobmanager
    command: taskmanager
    scale: 1
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
    networks:
      - flink_network

  mongodb:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: flink_db
    networks:
      - flink_network

networks:
  flink_network:
    driver: bridge
