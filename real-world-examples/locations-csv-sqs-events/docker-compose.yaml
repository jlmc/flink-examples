services:
  kafka:
    image: confluentinc/cp-kafka:7.7.2
    container_name: locations_sqs_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka_setup:
    image: confluentinc/cp-kafka:7.7.2
    container_name: locations_sqs_kafka_setup
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic locations-file-processing-results --partitions 1 --replication-factor 1
    restart: "no"

  kafka_ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: locations_sqs_kafka_ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  postgres:
    image: postgres:16
    container_name: locations_sqs_postgres
    environment:
      POSTGRES_DB: locations_db
      POSTGRES_USER: locations_user
      POSTGRES_PASSWORD: locations_password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U locations_user -d locations_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_setup:
    image: postgres:16
    container_name: locations_sqs_postgres_setup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: locations_password
    command:
      - psql
      - -h
      - postgres
      - -U
      - locations_user
      - -d
      - locations_db
      - -c
      - |
        CREATE TABLE IF NOT EXISTS staging_locations (
          id BIGSERIAL PRIMARY KEY,
          name TEXT NOT NULL,
          lat DOUBLE PRECISION,
          lon DOUBLE PRECISION,
          img_url TEXT,
          source_file_path TEXT NOT NULL,
          ingested_at TIMESTAMPTZ DEFAULT NOW()
        );
        CREATE TABLE IF NOT EXISTS locations (
          id BIGSERIAL PRIMARY KEY,
          name TEXT NOT NULL,
          lat DOUBLE PRECISION,
          lon DOUBLE PRECISION,
          img_url TEXT,
          created_at TIMESTAMPTZ DEFAULT NOW(),
          updated_at TIMESTAMPTZ DEFAULT NOW()
        );
    restart: "no"

  localstack:
    image: localstack/localstack:4.11.1
    container_name: locations_sqs_localstack
    environment:
      - SERVICES=s3,sqs
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - DEBUG=0
    ports:
      - "4566:4566"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:4566/_localstack/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  aws_setup:
    image: localstack/localstack:4.11.1
    container_name: locations_sqs_aws_setup
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ./scripts/init-aws.sh:/etc/localstack/init-aws.sh:ro
    entrypoint: ["/bin/bash", "/etc/localstack/init-aws.sh"]
    restart: "no"

  localstack_ui:
    image: visualvincent/guistack:1.2.0
    platform: linux/amd64
    container_name: locations_sqs_localstack_ui
    depends_on:
      localstack:
        condition: service_healthy
    ports:
      - "8585:80"
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-1
      - AWS_S3_ENDPOINT_URL=http://localstack:4566
      - AWS_SQS_ENDPOINT_URL=http://localstack:4566
      - AWS_S3_FORCE_PATH_STYLE=true
