services:
  postgres:
    image: postgres:16
    container_name: locations_sqs_postgres
    environment:
      POSTGRES_DB: locations_db
      POSTGRES_USER: locations_user
      POSTGRES_PASSWORD: locations_password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U locations_user -d locations_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_setup:
    image: postgres:16
    container_name: locations_sqs_postgres_setup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: locations_password
    command:
      - psql
      - -h
      - postgres
      - -U
      - locations_user
      - -d
      - locations_db
      - -c
      - |
        CREATE TABLE IF NOT EXISTS staging_locations (
          id BIGSERIAL PRIMARY KEY,
          name TEXT NOT NULL,
          lat DOUBLE PRECISION,
          lon DOUBLE PRECISION,
          img_url TEXT,
          source_file_path TEXT NOT NULL,
          ingested_at TIMESTAMPTZ DEFAULT NOW()
        );
        CREATE TABLE IF NOT EXISTS locations (
          id BIGSERIAL PRIMARY KEY,
          name TEXT NOT NULL,
          lat DOUBLE PRECISION,
          lon DOUBLE PRECISION,
          img_url TEXT,
          created_at TIMESTAMPTZ DEFAULT NOW(),
          updated_at TIMESTAMPTZ DEFAULT NOW()
        );
    restart: "no"

  localstack:
    image: localstack/localstack:4.11.1
    container_name: locations_sqs_localstack
    environment:
      - SERVICES=s3,sqs
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - DEBUG=0
    ports:
      - "4566:4566"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:4566/_localstack/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  aws_setup:
    image: localstack/localstack:4.11.1
    container_name: locations_sqs_aws_setup
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ./scripts/init-aws.sh:/etc/localstack/init-aws.sh:ro
    entrypoint: ["/bin/bash", "/etc/localstack/init-aws.sh"]
    restart: "no"
